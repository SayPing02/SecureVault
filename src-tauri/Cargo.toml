[package]
name = "securevault"
version = "0.1.0"
description = "Secure file storage using Shamir Secret Sharing and AES-256-GCM"
authors = ["Student Developer"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "securevault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri + plugins
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# crypto
aes-gcm = "0.10"
pbkdf2  = "0.12"
sha2    = "0.10"
rand    = "0.8"

# utilities
base64 = "0.22"
uuid   = { version = "1", features = ["v4"] }
zip    = { version = "2.2", default-features = false, features = ["deflate"] }
dirs   = "5"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
